# Public HTTPS edge for aetheris-gateway.
# Generated/kept in sync by scripts/setup-public-https.ps1 — do not hard-code
# product backends differently from frontend/nginx-gateway.conf.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_aetheris_service $hdr_upstream {
    default                         http://forensic-api:8080;
    forensic                        http://forensic-api:8080;
    mobile-android                  http://android-api:8080;
    android                         http://android-api:8080;
    mobile-ios                      http://ios-api:8080;
    ios                             http://ios-api:8080;
    mobile-extract                  http://android-api:8080;
    mobile                          http://android-api:8080;
    vuln                            http://vuln-api:8080;
}

server {
    listen 80;
    listen [::]:80;
    server_name future-softtech.co.in 122.179.141.248 _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name future-softtech.co.in;

    ssl_certificate     /etc/letsencrypt/live/future-softtech.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/future-softtech.co.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 0;
    error_log /dev/stderr warn;

    include /etc/nginx/conf.d/gateway-https-locations.inc;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 122.179.141.248 _;

    ssl_certificate     /etc/letsencrypt/live/122.179.141.248/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/122.179.141.248/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 0;
    error_log /dev/stderr warn;

    include /etc/nginx/conf.d/gateway-https-locations.inc;
}
