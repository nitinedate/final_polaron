# Safe bootstrap only. Startup regenerates verified external-drive overrides.
services:
  api:
    volumes:
    - type: bind
      source: C:/
      target: /host/c
      read_only: true
      bind:
        create_host_path: false
  worker-mobile:
    volumes:
    - type: bind
      source: C:/
      target: /host/c
      read_only: true
      bind:
        create_host_path: false
