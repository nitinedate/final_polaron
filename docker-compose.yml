services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - type: bind
        source: ${AETHERIS_BACKUP_DIR:-./backup}/ollama
        target: /root/.ollama
    environment:
      # Unload idle models so embedder can reclaim VRAM
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - *gpu
        limits:
          memory: 16G
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      default: {}
      aetheris-common:
        aliases:
          - ollama

  # One-shot: pull ALL required Ollama models via compose (no manual ollama pull)
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_PULL_MODELS: ${OLLAMA_PULL_MODELS:-qwen2.5:14b,qwen2.5:7b,deepseek-r1:14b,llama3.1:8b,gemma4:12b,qwen3.5:9b,nomic-embed-text}
      OLLAMA_PULL_ACCURACY: ${OLLAMA_PULL_ACCURACY:-true}
      OLLAMA_PULL_IGNORE_GPU: ${OLLAMA_PULL_IGNORE_GPU:-false}
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-qwen2.5:14b}
      LLM_REVIEW_MODEL: ${LLM_REVIEW_MODEL:-deepseek-r1:14b}
      LLM_REVIEW_MODEL_LARGE: ${LLM_REVIEW_MODEL_LARGE:-deepseek-r1:14b}
      LLM_FAST_MODEL: ${LLM_FAST_MODEL:-qwen3.5:9b}
      RAG_EMBEDDING_FALLBACK: ${RAG_EMBEDDING_FALLBACK:-nomic-embed-text}
      AGENT_MODEL: ${AGENT_MODEL:-qwen3.5:9b}
      GAP_REPORT_LLM_MODEL: ${GAP_REPORT_LLM_MODEL:-qwen2.5:7b}
      MOBILE_REPORT_LLM_MODEL: ${MOBILE_REPORT_LLM_MODEL:-qwen2.5:14b}
      MOBILE_REPORT_LLM_FALLBACK_MODEL: ${MOBILE_REPORT_LLM_FALLBACK_MODEL:-llama3.1:8b}
    volumes:
      - ./scripts/ollama_ensure_models.sh:/ensure.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed 's/\r$$//' /ensure.sh > /tmp/ensure.sh
        exec /bin/sh /tmp/ensure.sh
    restart: "no"
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - *gpu

  # NVIDIA CUDA runtime — stays up so GPU passthrough is live for OCR/RAG workers.
  nvidia-cuda:
    image: nvidia/cuda:12.6.3-base-ubuntu24.04
    container_name: rag_new2-nvidia-cuda
    command: ["sh", "-c", "nvidia-smi -L && echo CUDA_OK && exec sleep infinity"]
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - *gpu
    restart: unless-stopped

  # GPU smoke test: docker compose --profile gpu-test run --rm nvidia-smi
  nvidia-smi:
    image: nvidia/cuda:12.6.3-base-ubuntu24.04
    command: nvidia-smi
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - *gpu
    profiles:
      - gpu-test

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-forensic123}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    deploy:
      resources:
        limits:
          memory: 2G

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-ForensicDev1!Change}
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    deploy:
      resources:
        limits:
          memory: 1536M

  api:
    networks:
      default: {}
      aetheris-common:
        aliases:
          - forensic-api
    <<: *common-net
    init: true
    stop_grace_period: 30s
    image: rag_new2-api
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu130}
      pull: false
    env_file:
      - .env
    environment:
      <<: *worker-env
      DB_POOL_SIZE: ${API_DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${API_DB_MAX_OVERFLOW:-10}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-superadmin@admin.com}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-admin@123456789}
    ports:
      # Loopback only — LAN OpenVAS must not treat FastAPI as a customer web app.
      # Host :8080 is often taken by unrelated stacks (e.g. htw-web); use 8083.
      - "127.0.0.1:8083:8080"
    # GPU visible so /api/health/capacity and thermal probes see the host NVIDIA device
    gpus: all
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_started
      opensearch:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./scripts:/scripts
      - ./migrations:/migrations
      - ${HOST_EVIDENCE_PATH:-./evidence}:/evidence:ro
      - evidence_staging:/host/${EVIDENCE_STAGING_LETTER:-z}
      - type: bind
        source: ${AETHERIS_BACKUP_DIR:-./backup}/forensic-data
        target: /app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - *gpu
        limits:
          memory: 4G
    command: ["/scripts/start-api-container.sh", "app.main:app"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s

  # Disk extract/parse — forensic product only (vuln scans live in services/vuln).
  worker-disk:
    <<: [*common-net, *worker-lifecycle]
    image: rag_new2-api
    env_file:
      - .env
    environment:
      <<: *worker-env
    # CUDA device is visible; adaptive governor controls heavy GPU admission.
    gpus: all
    volumes:
      - ./backend:/app
      - ./scripts:/scripts:ro
      - ${HOST_EVIDENCE_PATH:-./evidence}:/evidence:ro
      - evidence_staging:/host/${EVIDENCE_STAGING_LETTER:-z}
      - type: bind
        source: ${AETHERIS_BACKUP_DIR:-./backup}/forensic-data/job-data
        target: /app/data
      - type: bind
        source: ${AETHERIS_BACKUP_DIR:-./backup}/forensic-data/uploads
        target: /app/data/uploads
      # V45: scratch for shard spool/parts. Point EXTRACT_SCRATCH_HOST_DIR at an NVMe/SSD
      # folder when the evidence drive is a USB HDD so reads and temp writes never share spindles.
      - type: bind
        source: ${EXTRACT_SCRATCH_HOST_DIR:-${AETHERIS_BACKUP_DIR:-./backup}/forensic-data/scratch}
        target: /scratch
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 14G
          cpus: "12.0"
    entrypoint: *dynamic-entrypoint
    command:
      - celery
      - -A
      - app.celery_app.celery
      - worker
      - --loglevel=info
      - --concurrency=8
      - --prefetch-multiplier=1
      - -Q
      # V45.2: inventory has its own lane; the disk pool is idle after extraction.
      - disk-build,disk-inventory

  # Dedicated parse pool so parse bursts cannot occupy every disk-build process.
  worker-parse:
    <<: [*common-net, *worker-lifecycle]
    image: rag_new2-api
    env_file:
      - .env
    environment:
      <<: *worker-env
    gpus: all
    volumes:
      - ./backend:/app
      - ./scripts:/scripts:ro
      - ${HOST_EVIDENCE_PATH:-./evidence}:/evidence:ro
      - evidence_staging:/host/${EVIDENCE_STAGING_LETTER:-z}
      - type: bind
        source: ${AETHERIS_BACKUP_DIR:-./backup}/forensic-data/job-data
        target: /app/data
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "8.0"
    entrypoint: *dynamic-entrypoint
    command:
      - celery
      - -A
      - app.celery_app.celery
      - worker
      - --loglevel=info
      - --concurrency=${PARSE_CELERY_CONCURRENCY:-6}
      - --prefetch-multiplier=1
      - -Q
      - disk-parse,disk-inventory

  # CPU-only evidence quality triage. This sidecar inspects poor images/documents
  # and sampled video frames while native parsing continues. It never runs GPU OCR.
  worker-quality:
    <<: [*common-net, *worker-lifecycle]
    image: rag_new2-api
    env_file:
      - .env
    environment:
      <<: *worker-env
      CUDA_VISIBLE_DEVICES: ""
      MOBILE_QUALITY_CPU_WORKERS: ${QUALITY_TRIAGE_CPU_WORKERS:-6}
      MOBILE_QUALITY_BATCH: ${QUALITY_TRIAGE_BATCH:-1200}
    gpus: []
    volumes:
      - ./backend:/app
      - ./scripts:/scripts:ro
      - ${HOST_EVIDENCE_PATH:-./evidence}:/evidence:ro
      - evidence_staging:/host/${EVIDENCE_STAGING_LETTER:-z}
      - type: bind
        source: ${AETHERIS_BACKUP_DIR:-./backup}/forensic-data/job-data
        target: /app/data
    depends_on:
      api:
        condition: service_healthy
    entrypoint: *dynamic-entrypoint
    command:
      - celery
      - -A
      - app.celery_app.celery
      - worker
      - --loglevel=info
      - --concurrency=${QUALITY_TRIAGE_CELERY_CONCURRENCY:-2}
      - --prefetch-multiplier=1
      - -Q
      - quality-triage

  # GPU embeddings on rag-index. OCR runs on worker-ocr-gpu so both can overlap.
  worker-rag-gpu:
    <<: [*common-net, *worker-lifecycle]
    image: rag_new2-api
    env_file:
      - .env
    environment:
      <<: *worker-env
      RAG_EMBEDDING_DEVICE: ${RAG_EMBEDDING_DEVICE:-cuda}
      RAG_BATCH_SIZE: ${RAG_BATCH_SIZE:-64}
      RAG_BATCH_SIZE_CAP: ${RAG_BATCH_SIZE_CAP:-64}
      RAG_CUDA_MEMORY_FRACTION: ${RAG_CUDA_MEMORY_FRACTION:-0.40}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_DEVICE: ${OCR_DEVICE:-cuda}
      OCR_CPU_WORKERS: ${OCR_CPU_WORKERS:-8}
      # Exclusive OCR may raise above RAG's tight cap after embedder unload.
      OCR_CUDA_MEMORY_FRACTION: ${OCR_CUDA_MEMORY_FRACTION:-0.62}
      GPU_THERMAL_THROTTLE_C: ${GPU_THERMAL_THROTTLE_C:-87}
      GPU_THERMAL_PAUSE_C: ${GPU_THERMAL_PAUSE_C:-92}
      GPU_THERMAL_ABORT_C: ${GPU_THERMAL_ABORT_C:-94}
      GPU_THERMAL_POWER_LIMIT_W: ${GPU_THERMAL_POWER_LIMIT_W:-70}
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - *gpu
        limits:
          memory: 8G
    volumes:
      - ./backend:/app
      - ./scripts:/scripts:ro
      - type: bind
        source: ${AETHERIS_BACKUP_DIR:-./backup}/forensic-data
        target: /app/data
      - type: bind
        source: ${AETHERIS_BACKUP_DIR:-./backup}/huggingface
        target: /root/.cache/huggingface
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_started
      opensearch:
        condition: service_started
      api:
        condition: service_healthy
    entrypoint: *dynamic-entrypoint
    command:
      - celery
      - -A
      - app.celery_app.celery
      - worker
      - --loglevel=info
      - --concurrency=1
      - --pool=solo
      - -Q
      - rag-index
      - --prefetch-multiplier=1

  # Dedicated OCR GPU worker — independent of RAG embeddings (two GPU slots).
  worker-ocr-gpu:
    <<: [*common-net, *worker-lifecycle]
    image: rag_new2-api
    env_file:
      - .env
    environment:
      <<: *worker-env
      OCR_ENABLED: "true"
      OCR_ENGINE: tesseract
      OCR_DEVICE: cuda
      OCR_GPU_ONLY: "true"
      OCR_PARALLEL_BUCKETS: "0"
      OCR_CPU_WORKERS: ${OCR_CPU_WORKERS:-8}
      OCR_CELERY_CONCURRENCY: "1"
      OCR_BATCH_LIMIT: ${OCR_BATCH_LIMIT:-64}
      OCR_CUDA_MEMORY_FRACTION: ${OCR_CUDA_MEMORY_FRACTION:-0.62}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      GPU_THERMAL_THROTTLE_C: ${GPU_THERMAL_THROTTLE_C:-87}
      GPU_THERMAL_PAUSE_C: ${GPU_THERMAL_PAUSE_C:-92}
      GPU_THERMAL_ABORT_C: ${GPU_THERMAL_ABORT_C:-94}
      GPU_THERMAL_POWER_LIMIT_W: ${GPU_THERMAL_POWER_LIMIT_W:-70}
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - *gpu
        limits:
          memory: 6G
    volumes:
      - ./backend:/app
      - ./scripts:/scripts:ro
      - type: bind
        source: ${AETHERIS_BACKUP_DIR:-./backup}/forensic-data
        target: /app/data
      - type: bind
        source: ${AETHERIS_BACKUP_DIR:-./backup}/huggingface
        target: /root/.cache/huggingface
    depends_on:
      api:
        condition: service_healthy
    entrypoint: *dynamic-entrypoint
    command:
      - celery
      - -A
      - app.celery_app.celery
      - worker
      - --loglevel=info
      - --concurrency=1
      - --pool=solo
      - --prefetch-multiplier=1
      - -Q
      - ocr

  worker-report:
    <<: [*common-net, *worker-lifecycle]
    image: rag_new2-api
    env_file:
      - .env
    environment:
      <<: *worker-env
    # CUDA device is visible; adaptive governor controls heavy GPU admission.
    gpus: all
    volumes:
      - ./backend:/app
      - ./scripts:/scripts:ro
      - type: bind
        source: ${AETHERIS_BACKUP_DIR:-./backup}/forensic-data
        target: /app/data
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G
    entrypoint: *dynamic-entrypoint
    command:
      - celery
      - -A
      - app.celery_app.celery
      - worker
      - --loglevel=info
      - --concurrency=3
      - -Q
      - report-gen

  # Forensic Agentic AI — isolated from disk-build / rag-index
  worker-agent:
    <<: [*common-net, *worker-lifecycle]
    image: rag_new2-api
    env_file:
      - .env
    environment:
      <<: *worker-env
    # GPU visible for capacity/thermal probes (nvidia-smi) — no heavy CUDA work here.
    gpus: all
    volumes:
      - ./backend:/app
      - ./scripts:/scripts:ro
      - ${HOST_EVIDENCE_PATH:-./evidence}:/evidence:ro
      - type: bind
        source: ${AETHERIS_BACKUP_DIR:-./backup}/forensic-data
        target: /app/data
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - *gpu
        limits:
          memory: 4G
    entrypoint: *dynamic-entrypoint
    command:
      - celery
      - -A
      - app.celery_app.celery
      - worker
      - --loglevel=info
      - --concurrency=2
      - --prefetch-multiplier=1
      - -Q
      - agent-orchestration

  worker-progress:
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 120s
    networks:
    - default
    - aetheris-common
    image: rag_new2-api
    env_file:
    - .env
    environment:
      CUDA_VISIBLE_DEVICES: ""
      DATABASE_URL: postgresql+psycopg2://forensic:forensic@postgres:5432/forensic
      REDIS_URL: redis://redis:6379/0
      REMAP_SIGTERM: ${CELERY_REMAP_SIGTERM:-SIGQUIT}
      CELERY_SHUTDOWN_RELEASE_GPU: ${CELERY_SHUTDOWN_RELEASE_GPU:-true}
      RESOURCE_GOVERNOR_ENABLED: ${RESOURCE_GOVERNOR_ENABLED:-true}
      RESOURCE_GOVERNOR_REDIS_URL: ${RESOURCE_GOVERNOR_REDIS_URL:-redis://redis:6379/15}
      RESOURCE_GOVERNOR_GROUP: ${RESOURCE_GOVERNOR_GROUP:-aetheris-host}
      RESOURCE_GOVERNOR_FAIL_OPEN_ON_UNAVAILABLE: ${RESOURCE_GOVERNOR_FAIL_OPEN_ON_UNAVAILABLE:-true}
      RESOURCE_GOVERNOR_CPU_MAX_SLOTS: ${RESOURCE_GOVERNOR_CPU_MAX_SLOTS:-10}
      RESOURCE_GOVERNOR_GPU_MAX_SLOTS: ${RESOURCE_GOVERNOR_GPU_MAX_SLOTS:-4}
      GPU_RELEASE_MODEL_AFTER_TASK: ${GPU_RELEASE_MODEL_AFTER_TASK:-true}
      DB_POOL_SIZE: '2'
      DB_MAX_OVERFLOW: '1'
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-90}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-forensic}
      HOST_EVIDENCE_ENABLED: ${HOST_EVIDENCE_ENABLED:-true}
      HOST_EVIDENCE_ROOT: ${HOST_EVIDENCE_ROOT:-}
      HOST_DRIVE_MAP: ${HOST_DRIVE_MAP:-}
      HOST_PATH_MAPPINGS: ${HOST_PATH_MAPPINGS:-}
      HOST_DRIVE_HELPER_URL: ${HOST_DRIVE_HELPER_URL:-http://host.docker.internal:9876}
      DATA_ROOT: /app/data
      TMPDIR: /app/data/tmp
      TMP: /app/data/tmp
      TEMP: /app/data/tmp
      AETHERIS_WORKER: '1'
      IDLE_IN_TRANSACTION_SESSION_TIMEOUT: '0'
      DYNAMIC_PERF_ENABLED: ${DYNAMIC_PERF_ENABLED:-true}
      DYNAMIC_PERF_FORCE: ${DYNAMIC_PERF_FORCE:-true}
      DYNAMIC_PERF_LOCK: ${DYNAMIC_PERF_LOCK:-FORENSIC_WORKER_CONCURRENCY,MAX_CONCURRENT_DISK_BUILDS}
      EXTRACT_DISK_WORKERS: ${EXTRACT_DISK_WORKERS:-8}
      EXTRACT_SHARD_COUNT: ${EXTRACT_SHARD_COUNT:-12}
      EXTRACT_UPLOAD_CONCURRENCY: ${EXTRACT_UPLOAD_CONCURRENCY:-8}
      EXTRACT_READ_SEMAPHORE: ${EXTRACT_READ_SEMAPHORE:-6}
      EXTRACT_READ_CHUNK_BYTES: ${EXTRACT_READ_CHUNK_BYTES:-8388608}
      EXTRACT_HDD_CHUNK_BYTES: ${EXTRACT_HDD_CHUNK_BYTES:-16777216}
      EXTRACT_SPOOL_MAX_BYTES: ${EXTRACT_SPOOL_MAX_BYTES:-134217728}
      MINIO_UPLOAD_PARALLEL: ${MINIO_UPLOAD_PARALLEL:-6}
      MINIO_UPLOAD_PART_MB: ${MINIO_UPLOAD_PART_MB:-64}
      EXTRACT_TARGET_GB: ${EXTRACT_TARGET_GB:-60}
      EXTRACT_TARGET_MINUTES: ${EXTRACT_TARGET_MINUTES:-35}
      EXTRACT_ZSTD_LEVEL: ${EXTRACT_ZSTD_LEVEL:-1}
      EXTRACT_MODE: ${EXTRACT_MODE:-forensic}
      BROWSER_URL_PARSE_LIMIT: ${BROWSER_URL_PARSE_LIMIT:-500}
      EXTRACT_UNCERTAIN_MAX_BYTES: ${EXTRACT_UNCERTAIN_MAX_BYTES:-16777216}
      EXTRACT_MAX_FILE_BYTES: ${EXTRACT_MAX_FILE_BYTES:-0}
      EXTRACT_HASH_FILES: ${EXTRACT_HASH_FILES:-false}
      EXTRACT_PROGRESS_STEP: ${EXTRACT_PROGRESS_STEP:-10000}
      EXTRACT_STOP_CHECK_INTERVAL: ${EXTRACT_STOP_CHECK_INTERVAL:-1000}
      EXTRACT_TAR_BUFSIZE: ${EXTRACT_TAR_BUFSIZE:-8388608}
      EXTRACT_PROGRESS_FLUSH_SEC: ${EXTRACT_PROGRESS_FLUSH_SEC:-10}
      EXTRACT_PROGRESS_LOG_SEC: ${EXTRACT_PROGRESS_LOG_SEC:-20}
      EXTRACT_SKIP_SYSTEM_PATHS: ${EXTRACT_SKIP_SYSTEM_PATHS:-false}
      EXTRACT_REPLAN_ON_RESUME: ${EXTRACT_REPLAN_ON_RESUME:-false}
      MAX_CONCURRENT_DISK_BUILDS: ${MAX_CONCURRENT_DISK_BUILDS:-4}
      AETHERIS_SHARE_HOST: ${AETHERIS_SHARE_HOST:-true}
      LONG_JOB_TIMEOUT_SEC: ${LONG_JOB_TIMEOUT_SEC:-0}
      PARSE_DRAIN_MAX_ROUNDS: ${PARSE_DRAIN_MAX_ROUNDS:-40}
      PARSE_DRAIN_BATCH_LIMIT: ${PARSE_DRAIN_BATCH_LIMIT:-2400}
      PARSE_BATCH_LIMIT: ${PARSE_BATCH_LIMIT:-8000}
      PARSE_WORKERS: ${PARSE_WORKERS:-6}
      PARSE_PARALLEL_ENABLED: ${PARSE_PARALLEL_ENABLED:-true}
      PARSE_DB_COMMIT_BATCH: ${PARSE_DB_COMMIT_BATCH:-250}
      PARSE_PARALLEL_BUCKETS: ${PARSE_PARALLEL_BUCKETS:-2}
      PARSE_BUCKET_MIN_PENDING: ${PARSE_BUCKET_MIN_PENDING:-2000}
      AXIOM_INVENTORY_WORKERS: ${AXIOM_INVENTORY_WORKERS:-8}
      AXIOM_INVENTORY_BATCH_SIZE: ${AXIOM_INVENTORY_BATCH_SIZE:-100}
      PHASE1_ARTIFACT_FILTER: ${PHASE1_ARTIFACT_FILTER:-true}
      EXTRACT_THEN_PROCESS: ${EXTRACT_THEN_PROCESS:-true}
      PHASE3_STREAM_DURING_EXTRACT: ${PHASE3_STREAM_DURING_EXTRACT:-false}
      PHASE3_STREAM_RAG_DURING_EXTRACT: ${PHASE3_STREAM_RAG_DURING_EXTRACT:-false}
      PHASE3_STREAM_OCR_DURING_EXTRACT: ${PHASE3_STREAM_OCR_DURING_EXTRACT:-false}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-BAAI/bge-m3}
      RAG_IMAGE_EMBED_MODEL: ${RAG_IMAGE_EMBED_MODEL:-clip-ViT-B-32}
      HF_PULL_MODELS: ${HF_PULL_MODELS:-BAAI/bge-m3,zai-org/GLM-OCR,sentence-transformers/clip-ViT-B-32,cross-encoder/ms-marco-MiniLM-L-6-v2}
      RAG_EMBEDDING_DEVICE: ${RAG_EMBEDDING_DEVICE:-cuda}
      RAG_BATCH_SIZE: ${RAG_BATCH_SIZE:-64}
      RAG_BATCH_SIZE_CAP: ${RAG_BATCH_SIZE_CAP:-64}
      RAG_CUDA_MEMORY_FRACTION: ${RAG_CUDA_MEMORY_FRACTION:-0.55}
      GPU_THERMAL_ENABLED: ${GPU_THERMAL_ENABLED:-true}
      GPU_THERMAL_START_MAX_C: ${GPU_THERMAL_START_MAX_C:-90}
      GPU_THERMAL_THROTTLE_C: ${GPU_THERMAL_THROTTLE_C:-87}
      GPU_THERMAL_PAUSE_C: ${GPU_THERMAL_PAUSE_C:-92}
      GPU_THERMAL_RESUME_C: ${GPU_THERMAL_RESUME_C:-84}
      GPU_THERMAL_HONOR_ENV: ${GPU_THERMAL_HONOR_ENV:-true}
      GPU_THERMAL_POLL_SEC: ${GPU_THERMAL_POLL_SEC:-2}
      GPU_THERMAL_HOT_BATCH_SLEEP_SEC: ${GPU_THERMAL_HOT_BATCH_SLEEP_SEC:-5}
      GPU_THERMAL_EMBED_REST_SEC: ${GPU_THERMAL_EMBED_REST_SEC:-0.6}
      GPU_THERMAL_DUTY_CYCLE_BATCHES: ${GPU_THERMAL_DUTY_CYCLE_BATCHES:-4}
      GPU_THERMAL_DUTY_CYCLE_REST_SEC: ${GPU_THERMAL_DUTY_CYCLE_REST_SEC:-3}
      GPU_THERMAL_ADAPTIVE_BATCH: ${GPU_THERMAL_ADAPTIVE_BATCH:-true}
      GPU_THERMAL_COOL_BOOST_C: ${GPU_THERMAL_COOL_BOOST_C:-58}
      GPU_THERMAL_COOL_BATCH_MULTIPLIER: ${GPU_THERMAL_COOL_BATCH_MULTIPLIER:-1.25}
      GPU_THERMAL_FALLBACK_DUTY: ${GPU_THERMAL_FALLBACK_DUTY:-true}
      GPU_THERMAL_RISE_DELTA_C: ${GPU_THERMAL_RISE_DELTA_C:-5}
      GPU_THERMAL_RISE_WINDOW_SEC: ${GPU_THERMAL_RISE_WINDOW_SEC:-12}
      GPU_THERMAL_POWER_LIMIT_W: ${GPU_THERMAL_POWER_LIMIT_W:-70}
      GPU_THERMAL_ABORT_C: ${GPU_THERMAL_ABORT_C:-94}
      GPU_HEAVY_MAX_CONCURRENT: ${GPU_HEAVY_MAX_CONCURRENT:-2}
      GPU_HEAVY_LOCK_WAIT_SEC: ${GPU_HEAVY_LOCK_WAIT_SEC:-0}
      GPU_HEAVY_LOCK_TTL_SEC: ${GPU_HEAVY_LOCK_TTL_SEC:-600}
      CPU_THERMAL_THROTTLE_C: ${CPU_THERMAL_THROTTLE_C:-86}
      CPU_THERMAL_PAUSE_C: ${CPU_THERMAL_PAUSE_C:-94}
      PIPELINE_SUPERVISOR_ENABLED: ${PIPELINE_SUPERVISOR_ENABLED:-true}
      PIPELINE_STALE_SEC: ${PIPELINE_STALE_SEC:-180}
      PIPELINE_SUPERVISOR_INTERVAL_SEC: ${PIPELINE_SUPERVISOR_INTERVAL_SEC:-10}
