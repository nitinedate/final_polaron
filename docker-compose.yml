    volumes:
    - ./backend:/app
    - ./scripts:/scripts:ro
    - ${HOST_EVIDENCE_PATH:-./evidence}:/evidence:ro
    - type: bind
      source: ${AETHERIS_BACKUP_DIR:-./backup}/forensic-data
      target: /app/data
    depends_on:
      api:
        condition: service_healthy
    entrypoint:
    - python
    - /scripts/dynamic_perf_entrypoint.py
    command:
    - celery
    - -A
    - app.celery_forensic.celery
    - worker
    - --loglevel=info
    - --concurrency=1
    - --prefetch-multiplier=1
    - -Q
    - disk-progress

  worker-beat:
    <<: [*common-net, *worker-lifecycle]
    image: rag_new2-api
    env_file:
      - .env
    environment:
      <<: *worker-env
    # CUDA device is visible; adaptive governor controls heavy GPU admission.
    gpus: all
    volumes:
      - ./backend:/app
      - ./scripts:/scripts:ro
    depends_on:
      api:
        condition: service_healthy
    entrypoint: *dynamic-entrypoint
    command:
      - celery
      - -A
      - app.celery_app.celery
      - beat
      - --loglevel=info
      - --schedule
      - /tmp/celerybeat-schedule-forensic

  # UI is the gateway on :3000 / :3001. This leftover frontend is not started
  # unless profile legacy-ui is enabled (would conflict with the gateway).
  frontend:
    profiles: ["legacy-ui"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_AETHERIS_SERVICE: forensic
        VITE_VULN_MODULE_ENABLED: "false"
    ports:
      - "3001:80"
    depends_on:
      api:
        condition: service_healthy

  worker-rag-prep:
    <<: [*common-net, *worker-lifecycle]
    image: rag_new2-api
    env_file:
      - .env
    environment:
      <<: *worker-env
      CUDA_VISIBLE_DEVICES: ""
      MOBILE_QUALITY_CPU_WORKERS: ${QUALITY_TRIAGE_CPU_WORKERS:-6}
      MOBILE_QUALITY_BATCH: ${QUALITY_TRIAGE_BATCH:-1200}
    gpus: []
    volumes:
      - ./backend:/app
      - ./scripts:/scripts:ro
      - ${HOST_EVIDENCE_PATH:-./evidence}:/evidence:ro
      - evidence_staging:/host/${EVIDENCE_STAGING_LETTER:-z}
      - type: bind
        source: ${AETHERIS_BACKUP_DIR:-./backup}/forensic-data/job-data
        target: /app/data
    depends_on:
      api:
        condition: service_healthy
    entrypoint: *dynamic-entrypoint
    command:
      - celery
      - -A
      - app.celery_app.celery
      - worker
      - --loglevel=info
      - --concurrency=${RAG_CPU_PREP_WORKERS:-6}
      - --prefetch-multiplier=1
      - -Q
      - rag-prep

  # GPU embeddings on rag-index. OCR runs on worker-ocr-gpu so both can overlap.
volumes:
  # V45.3: evidence staged into the docker-desktop VM (ext4). Reads are native —
  # no Windows file-sharing layer, so no 2-3 MB/s ceiling and no unkillable
  # D-state worker. Appears in the UI as drive ${EVIDENCE_STAGING_LETTER:-Z}:.
  # Fill it with Stage-Evidence.cmd <source folder> <case name>.
  evidence_staging:
  neo4j_data:
  opensearch_data:

networks:
  aetheris-common:
    external: true
    name: aetheris-common
