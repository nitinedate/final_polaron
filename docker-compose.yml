  OCR_ENABLED: ${OCR_ENABLED:-true}
  OCR_ENGINE: ${OCR_ENGINE:-tesseract}
  OCR_MODEL: ${OCR_MODEL:-zai-org/GLM-OCR}
  OCR_DEVICE: ${OCR_DEVICE:-cuda}
  OCR_GPU_ONLY: ${OCR_GPU_ONLY:-false}
  OCR_PARALLEL_BUCKETS: ${OCR_PARALLEL_BUCKETS:-2}
  OCR_MAX_PAGES: ${OCR_MAX_PAGES:-10}
  OCR_MAX_NEW_TOKENS: ${OCR_MAX_NEW_TOKENS:-512}
  OCR_CPU_WORKERS: ${OCR_CPU_WORKERS:-8}
  GAP_REPORT_LLM_ENABLED: ${GAP_REPORT_LLM_ENABLED:-true}
  GAP_REPORT_LLM_MODEL: ${GAP_REPORT_LLM_MODEL:-qwen2.5:7b}
  MOBILE_REPORT_LLM_ENABLED: ${MOBILE_REPORT_LLM_ENABLED:-true}
