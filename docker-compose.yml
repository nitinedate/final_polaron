  PIPELINE_PARALLEL_SLOTS: ${PIPELINE_PARALLEL_SLOTS:-10}
  PIPELINE_STALE_SEC: ${PIPELINE_STALE_SEC:-180}
  PIPELINE_SUPERVISOR_INTERVAL_SEC: ${PIPELINE_SUPERVISOR_INTERVAL_SEC:-10}
  PIPELINE_SEQUENTIAL_AGENTS: ${PIPELINE_SEQUENTIAL_AGENTS:-false}
  PARSE_DRAIN_INTERLEAVE_RAG: ${PARSE_DRAIN_INTERLEAVE_RAG:-false}
  RAG_AUTO_AFTER_DISK: ${RAG_AUTO_AFTER_DISK:-false}
  RAG_EMBEDDING_ENABLED: ${RAG_EMBEDDING_ENABLED:-false}
  RAG_BACKGROUND_AFTER_BASELINE: ${RAG_BACKGROUND_AFTER_BASELINE:-false}
  PHASE3_AUTO_AFTER_DISK: ${PHASE3_AUTO_AFTER_DISK:-true}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  NEO4J_URI: bolt://neo4j:7687
