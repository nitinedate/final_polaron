# Docker embedded DNS — re-resolve api on each request when proxy_pass uses a variable.
# Prevents 502s after `docker compose up` recreates the api container (stale keepalive IPs).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_log /dev/stderr warn;

    # Large forensic evidence uploads (E01 segments, etc.)
    client_max_body_size 0;

    location /api/ {
        set $fwd_tenant $http_x_tenant;
        if ($fwd_tenant = "") {
            set $fwd_tenant "platform";
        }
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_pass_request_headers on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Aetheris-Agent-Instance $http_x_aetheris_agent_instance;
        proxy_set_header X-Tenant $fwd_tenant;
        proxy_hide_header Server;
        proxy_hide_header Date;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 30s;
        # Long extracts/scans stream or stay open; do not cut them at 1 hour.
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
        send_timeout 7d;
        client_body_timeout 7d;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
