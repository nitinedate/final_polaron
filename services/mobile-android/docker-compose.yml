# Android mobile forensics — physically isolated backend, evidence store and worker queues.
# From repo root:
#   docker compose -f services/mobile-android/docker-compose.yml --project-directory . up -d --build
name: aetheris-mobile-android

x-gpu: &gpu
  driver: nvidia
  count: 1
  capabilities: [gpu]

x-mobile-env: &mobile-env
  AETHERIS_SERVICE: mobile-android
  VULN_MODULE_ENABLED: "false"
  DATABASE_URL: postgresql+psycopg2://forensic:forensic@postgres:5432/forensic
  REDIS_URL: redis://redis:6379/1
  # V45.3: SIGTERM => Celery cold shutdown; see root docker-compose.yml x-worker-lifecycle.
  REMAP_SIGTERM: ${CELERY_REMAP_SIGTERM:-SIGQUIT}
  CELERY_SHUTDOWN_RELEASE_GPU: ${CELERY_SHUTDOWN_RELEASE_GPU:-true}
  # Shared leases only. Job state/evidence NEVER enters this Redis.
  RESOURCE_GOVERNOR_ENABLED: ${RESOURCE_GOVERNOR_ENABLED:-true}
  RESOURCE_GOVERNOR_REDIS_URL: ${RESOURCE_GOVERNOR_REDIS_URL:-redis://redis:6379/15}
  RESOURCE_GOVERNOR_GROUP: ${RESOURCE_GOVERNOR_GROUP:-aetheris-host}
  RESOURCE_GOVERNOR_FAIL_OPEN_ON_UNAVAILABLE: ${RESOURCE_GOVERNOR_FAIL_OPEN_ON_UNAVAILABLE:-true}
  RESOURCE_GOVERNOR_CPU_MAX_SLOTS: ${RESOURCE_GOVERNOR_CPU_MAX_SLOTS:-10}
  RESOURCE_GOVERNOR_GPU_MAX_SLOTS: ${RESOURCE_GOVERNOR_GPU_MAX_SLOTS:-4}
  GPU_RELEASE_MODEL_AFTER_TASK: ${GPU_RELEASE_MODEL_AFTER_TASK:-true}
  DB_POOL_SIZE: ${MOBILE_WORKER_DB_POOL_SIZE:-2}
  DB_MAX_OVERFLOW: ${MOBILE_WORKER_DB_MAX_OVERFLOW:-2}
  DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
  MINIO_BUCKET: mobile-android
  HOST_EVIDENCE_ENABLED: ${HOST_EVIDENCE_ENABLED:-true}
  HOST_DRIVE_HELPER_URL: ${HOST_DRIVE_HELPER_URL:-http://host.docker.internal:9876}
  DATA_ROOT: /app/data
  TMPDIR: /app/data/tmp
  TMP: /app/data/tmp
  TEMP: /app/data/tmp
  # Shard tar spools are multi-GB. Keep them off the evidence/backup drive.
  EXTRACT_SCRATCH_DIR: /scratch
  AETHERIS_WORKER: "1"
  IDLE_IN_TRANSACTION_SESSION_TIMEOUT: "0"
  EXTRACT_MODE: mobile
  EXTRACT_MOBILE_WORKERS: ${EXTRACT_MOBILE_WORKERS:-12}
  EXTRACT_SHARD_COUNT: ${EXTRACT_SHARD_COUNT:-12}
  # Product-local ceiling; host-wide adaptive semaphore may reduce this live.
  MAX_CONCURRENT_DISK_BUILDS: ${MOBILE_MAX_CONCURRENT_BUILDS:-4}
  PIPELINE_SUPERVISOR_ENABLED: "true"
  FORENSIC_MAX_PARALLELISM: ${FORENSIC_MAX_PARALLELISM:-10}
  PIPELINE_PARALLEL_SLOTS: ${PIPELINE_PARALLEL_SLOTS:-10}
  PHASE3_AUTO_AFTER_DISK: "true"
  LONG_JOB_TIMEOUT_SEC: ${LONG_JOB_TIMEOUT_SEC:-0}
  DYNAMIC_PERF_ENABLED: ${DYNAMIC_PERF_ENABLED:-true}
  DYNAMIC_PERF_FORCE: ${DYNAMIC_PERF_FORCE:-true}
  AETHERIS_SHARE_HOST: ${AETHERIS_SHARE_HOST:-true}
  GPU_THERMAL_ENABLED: ${GPU_THERMAL_ENABLED:-true}
  GPU_THERMAL_THROTTLE_C: ${GPU_THERMAL_THROTTLE_C:-87}
  GPU_THERMAL_PAUSE_C: ${GPU_THERMAL_PAUSE_C:-92}
  GPU_THERMAL_RESUME_C: ${GPU_THERMAL_RESUME_C:-84}
  GPU_THERMAL_ABORT_C: ${GPU_THERMAL_ABORT_C:-94}
  GPU_HEAVY_MAX_CONCURRENT: ${GPU_HEAVY_MAX_CONCURRENT:-2}
  CPU_THERMAL_THROTTLE_C: ${CPU_THERMAL_THROTTLE_C:-86}
  CPU_THERMAL_PAUSE_C: ${CPU_THERMAL_PAUSE_C:-94}
  OCR_ENABLED: "true"
  OCR_DEVICE: cuda
  OCR_GPU_ONLY: "true"
  OCR_PARALLEL_BUCKETS: "0"
  OCR_ENGINE: ${OCR_ENGINE:-tesseract}
  OCR_MODEL: ${OCR_MODEL:-zai-org/GLM-OCR}
  RAG_EMBEDDING_DEVICE: ${RAG_EMBEDDING_DEVICE:-cuda}
  RAG_BATCH_SIZE: ${RAG_BATCH_SIZE:-64}
  RAG_BATCH_SIZE_CAP: ${RAG_BATCH_SIZE_CAP:-64}
  NVIDIA_VISIBLE_DEVICES: all
  NVIDIA_DRIVER_CAPABILITIES: compute,utility
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  # .env points at the host. Inside this container Neo4j is the published bolt port.
  NEO4J_URI: bolt://host.docker.internal:7687
  NEO4J_USER: ${NEO4J_USER:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-forensic123}

x-app-common: &app-common
  networks:
    - default
    - aetheris-common
  image: aetheris-mobile-android-app
  env_file:
    - .env
  environment:
    <<: *mobile-env
  gpus: all
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./backend:/app
    - ./scripts:/scripts:ro
    - ${ANDROID_HOST_EVIDENCE_PATH:-./evidence/android}:/evidence:ro
    - type: bind
      source: ${AETHERIS_BACKUP_DIR:-./backup}/forensic-data/mobile-android
      target: /app/data
    - type: bind
      source: ${AETHERIS_BACKUP_DIR:-./backup}/huggingface-android
      target: /root/.cache/huggingface
    # Compressed shard temps. Point EXTRACT_SCRATCH_HOST_DIR at a volume with
    # tens of GB free; a full backup drive returns EIO on these writes.
    - type: bind
      source: ${EXTRACT_SCRATCH_HOST_DIR:-${AETHERIS_BACKUP_DIR:-./backup}/forensic-data/scratch}
      target: /scratch

services:
  nvidia-cuda:
    image: nvidia/cuda:12.6.3-base-ubuntu24.04
    command: ["sh", "-c", "nvidia-smi -L && echo CUDA_OK && exec sleep infinity"]
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - *gpu
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nvidia-smi -L"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  api:
    networks:
      default: {}
      aetheris-common:
        aliases:
          - android-api
    <<: *app-common
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu130}
    init: true
    stop_grace_period: 30s
    environment:
      <<: *mobile-env
      DB_POOL_SIZE: ${MOBILE_API_DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${MOBILE_API_DB_MAX_OVERFLOW:-10}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3002}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-superadmin@admin.com}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-admin@123456789}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./backend:/app
      - ./scripts:/scripts
      - ./migrations:/migrations
      - ${ANDROID_HOST_EVIDENCE_PATH:-./evidence/android}:/evidence:ro
      - type: bind
        source: ${AETHERIS_BACKUP_DIR:-./backup}/forensic-data/mobile-android
        target: /app/data
      - type: bind
        source: ${AETHERIS_BACKUP_DIR:-./backup}/huggingface-android
        target: /root/.cache/huggingface
    command: ["/scripts/start-api-container.sh", "app.main_mobile_android:app"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s

  worker-build:
    <<: *app-common
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 120s
    depends_on:
      api: {condition: service_healthy}
      nvidia-cuda: {condition: service_healthy}
    entrypoint: ["python", "/scripts/dynamic_perf_entrypoint.py"]
    command: ["celery", "-A", "app.celery_mobile_android.celery", "worker", "--loglevel=info", "--concurrency=${MOBILE_BUILD_CONCURRENCY:-5}", "--prefetch-multiplier=1", "-Q", "android-build"]

  # Parse pool is independent from image extraction so parse backlog cannot
  # starve new android acquisitions/builds.
  worker-parse:
    <<: *app-common
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 120s
    depends_on:
      api: {condition: service_healthy}
      nvidia-cuda: {condition: service_healthy}
    entrypoint: ["python", "/scripts/dynamic_perf_entrypoint.py"]
    command: ["celery", "-A", "app.celery_mobile_android.celery", "worker", "--loglevel=info", "--concurrency=${MOBILE_PARSE_CONCURRENCY:-4}", "--prefetch-multiplier=1", "-Q", "android-parse"]

  # CPU-only quality triage sidecar; fills the OCR bucket during parsing.
  worker-quality:
    <<: *app-common
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 120s
    gpus: []
    environment:
      <<: *mobile-env
      CUDA_VISIBLE_DEVICES: ""
      MOBILE_QUALITY_CPU_WORKERS: ${QUALITY_TRIAGE_CPU_WORKERS:-6}
      MOBILE_QUALITY_BATCH: ${QUALITY_TRIAGE_BATCH:-1200}
    depends_on:
      api: {condition: service_healthy}
    entrypoint: ["python", "/scripts/dynamic_perf_entrypoint.py"]
    command: ["celery", "-A", "app.celery_mobile_android.celery", "worker", "--loglevel=info", "--concurrency=${QUALITY_TRIAGE_CELERY_CONCURRENCY:-2}", "--prefetch-multiplier=1", "-Q", "android-quality"]

  worker-rag:
    <<: *app-common
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 120s
    environment:
      <<: *mobile-env
      OCR_ENABLED: "false"
      RAG_CUDA_MEMORY_FRACTION: ${RAG_CUDA_MEMORY_FRACTION:-0.35}
    depends_on:
      api: {condition: service_healthy}
      nvidia-cuda: {condition: service_healthy}
    entrypoint: ["python", "/scripts/dynamic_perf_entrypoint.py"]
    command: ["celery", "-A", "app.celery_mobile_android.celery", "worker", "--loglevel=info", "--concurrency=1", "--pool=solo", "--prefetch-multiplier=1", "-Q", "android-rag"]

  worker-ocr:
    <<: *app-common
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 120s
    environment:
      <<: *mobile-env
      OCR_CELERY_CONCURRENCY: "1"
      OCR_ENGINE: tesseract
      OCR_BATCH_LIMIT: ${OCR_BATCH_LIMIT:-64}
      OCR_CUDA_MEMORY_FRACTION: ${OCR_CUDA_MEMORY_FRACTION:-0.45}
    depends_on:
      api: {condition: service_healthy}
      nvidia-cuda: {condition: service_healthy}
    entrypoint: ["python", "/scripts/dynamic_perf_entrypoint.py"]
    command: ["celery", "-A", "app.celery_mobile_android.celery", "worker", "--loglevel=info", "--concurrency=1", "--pool=solo", "--prefetch-multiplier=1", "-Q", "android-ocr"]

  worker-report:
    <<: *app-common
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 120s
    depends_on:
      api: {condition: service_healthy}
      nvidia-cuda: {condition: service_healthy}
    entrypoint: ["python", "/scripts/dynamic_perf_entrypoint.py"]
    command: ["celery", "-A", "app.celery_mobile_android.celery", "worker", "--loglevel=info", "--concurrency=${MOBILE_REPORT_CONCURRENCY:-2}", "--prefetch-multiplier=1", "-Q", "android-report"]

  worker-progress:
    <<: *app-common
    init: true
    gpus: []
    environment:
      <<: *mobile-env
      WORKER_ROLE: progress
      NVIDIA_VISIBLE_DEVICES: none
      CUDA_VISIBLE_DEVICES: ""
      DB_POOL_SIZE: 2
      DB_POOL_TIMEOUT: 5
      PGOPTIONS: "-c statement_timeout=15000 -c lock_timeout=5000"
      DB_MAX_OVERFLOW: 1
    command: ["celery", "-A", "app.celery_mobile_android.celery", "worker", "--loglevel=info", "--concurrency=1", "--prefetch-multiplier=1", "-Q", "android-progress"]

  worker-beat:
    <<: *app-common
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 120s
    depends_on:
      api: {condition: service_healthy}
      nvidia-cuda: {condition: service_healthy}
    entrypoint: ["python", "/scripts/dynamic_perf_entrypoint.py"]
    command: ["celery", "-A", "app.celery_mobile_android.celery", "beat", "--loglevel=info", "--schedule", "/tmp/celerybeat-android"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_AETHERIS_SERVICE: mobile-android
        VITE_VULN_MODULE_ENABLED: "false"
    ports:
      - "3002:80"
    depends_on:
      api: {condition: service_healthy}

  worker-rag-prep:
    <<: *app-common
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 120s
    gpus: []
    environment:
      <<: *mobile-env
      CUDA_VISIBLE_DEVICES: ""
      MOBILE_QUALITY_CPU_WORKERS: ${QUALITY_TRIAGE_CPU_WORKERS:-6}
      MOBILE_QUALITY_BATCH: ${QUALITY_TRIAGE_BATCH:-1200}
    depends_on:
      api: {condition: service_healthy}
    entrypoint: ["python", "/scripts/dynamic_perf_entrypoint.py"]
    command: ["celery", "-A", "app.celery_mobile_android.celery", "worker", "--loglevel=info", "--concurrency=${RAG_CPU_PREP_WORKERS:-6}", "--prefetch-multiplier=1", "-Q", "android-rag-prep"]

networks:
  aetheris-common:
    external: true
    name: aetheris-common
